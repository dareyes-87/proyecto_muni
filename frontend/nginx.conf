server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de fotos de hasta 10MB (el backend limita a 5MB)
    client_max_body_size 10m;

    # Cabeceras de seguridad para el SPA (la API ya las envía vía helmet, pero los
    # archivos estáticos servidos por nginx no las heredan). Cierra el hueco de
    # clickjacking (frame-ancestors/X-Frame-Options) y endurece el renderizado.
    # Nota: aplica solo al build de producción (FRONTEND_TARGET=production); el
    # servidor de desarrollo de Vite no pasa por aquí. Verificar en runtime al
    # desplegar a producción.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # React Router: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy de imágenes de producto (fotos de medicamentos), que no son sensibles.
    # Las fotos de dispensación (recetas/evidencia) NO se exponen aquí: se sirven
    # por el endpoint autenticado bajo /api/ (H-11).
    location /uploads/medicamentos/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
