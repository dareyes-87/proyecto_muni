services:
  db:
    image: postgres:16-alpine
    container_name: farmag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-farmag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farmag_secret_2026}
      POSTGRES_DB: ${DB_NAME:-farmag_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde el propio host (no en toda la red). La API se conecta
    # por la red interna de Docker (host "db"), no por este puerto publicado (H-04).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-farmag} -d ${DB_NAME:-farmag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # development (por defecto) = tsx watch. production = node dist.
      # Ambos targets arrancan con docker-entrypoint.sh (respaldo previo +
      # migraciones versionadas). Para producción use docker-compose.prod.yml.
      target: ${BACKEND_TARGET:-development}
    container_name: farmag_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Zona horaria de Guatemala: el cron de vencimiento (00:05) y el cálculo de
      # "hoy" deben correr en hora local, no en UTC (H-02).
      TZ: America/Guatemala
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-farmag}:${DB_PASSWORD:-farmag_secret_2026}@db:5432/${DB_NAME:-farmag_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-farmag_jwt_secret_cambiar_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Bootstrap del primer administrador (H-002). Si no se define una contraseña,
      # el seed genera una aleatoria y la imprime una vez en los logs de este servicio.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    # Solo accesible desde el propio host. El frontend (web) llega a la API por la
    # red interna de Docker; los usuarios acceden únicamente por el puerto del
    # frontend (H-04).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:z
      - ./backend/prisma:/app/prisma:z
      - ./backend/uploads:/app/uploads:z
      # Montado para poder ejecutar las pruebas en el contenedor con `npm test`.
      - ./backend/tests:/app/tests:z
      # Respaldo previo a cada arranque (ver backend/docker-entrypoint.sh)
      - ./backups:/app/backups:z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-development}
    container_name: farmag_web
    restart: unless-stopped
    environment:
      VITE_LAN_IP: ${LAN_IP:-}
    # Se publican ambos puertos porque el puerto activo depende de FRONTEND_TARGET:
    # en desarrollo responde 5173 (Vite) y en producción 80 (nginx). El puerto del
    # modo inactivo queda publicado pero sin proceso detrás (no responde) — es
    # inofensivo; los scripts start.sh/start.cmd anuncian la URL correcta según el
    # modo (H-08). Para exponer solo uno, fijar FRONTEND_TARGET y quitar el otro.
    ports:
      - "80:80"
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src:z
      - ./frontend/public:/app/public:z

  # Respaldo automático de la base de datos.
  # Ejecuta pg_dump al arrancar y luego cada BACKUP_INTERVAL_HOURS horas; guarda los
  # archivos en ./backups (carpeta del host) y borra los de más de BACKUP_KEEP_DAYS días.
  # - Reutiliza la imagen postgres:16-alpine que ya usa el servicio db (no descarga nada nuevo).
  # - Usa las mismas variables DB_* que db y api, con los mismos valores por defecto, así que
  #   funciona con cualquier .env que ya sirva para el sistema.
  # - El script va en línea (no como archivo .sh) para que no le afecten los finales de línea
  #   CRLF de Windows. Dentro de este YAML, cada "$" del script se escribe "$$".
  # - Estado: ./backups/ULTIMO_RESPALDO.txt (OK o ERROR) e historial en historial_respaldos.log.
  # Restaurar: ver docs/RESPALDOS.md.
  backup:
    image: postgres:16-alpine
    container_name: farmag_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-farmag}
      PGPASSWORD: ${DB_PASSWORD:-farmag_secret_2026}
      PGDATABASE: ${DB_NAME:-farmag_db}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DIR=/backups
        mkdir -p "$$DIR"
        echo "Respaldo automatico: cada $${BACKUP_INTERVAL_HOURS} h, se conservan $${BACKUP_KEEP_DAYS} dias"
        while true; do
          TS=$$(date -u +%Y%m%d_%H%M%SZ)
          OUT="$$DIR/farmag_$$TS.dump"
          if pg_dump -Fc -f "$$OUT.tmp" && pg_restore -l "$$OUT.tmp" > /dev/null 2>&1 && [ -s "$$OUT.tmp" ]; then
            mv "$$OUT.tmp" "$$OUT"
            SIZE=$$(wc -c < "$$OUT")
            echo "$$TS OK $$SIZE bytes farmag_$$TS.dump" >> "$$DIR/historial_respaldos.log"
            echo "OK $$TS" > "$$DIR/ULTIMO_RESPALDO.txt"
            find "$$DIR" -name 'farmag_*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
            sleep $$((BACKUP_INTERVAL_HOURS * 3600))
          else
            rm -f "$$OUT.tmp"
            echo "$$TS ERROR" >> "$$DIR/historial_respaldos.log"
            echo "ERROR $$TS" > "$$DIR/ULTIMO_RESPALDO.txt"
            sleep 300
          fi
        done

volumes:
  pgdata:
